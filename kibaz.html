<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KibaZ — AI Interface</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070f; --bg2:#0a0f1f; --panel:rgba(14,20,40,.62); --line:rgba(120,160,255,.14);
  --text:#e8eeff; --dim:#8b97bd; --blue:#4f8cff; --cyan:#3fd0ff; --violet:#8a6bff;
  --glow:0 0 24px rgba(79,140,255,.45);
  --sans:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(120,160,255,.18);border-radius:8px}

/* ---------- backdrop ---------- */
#stars{position:fixed;inset:0;z-index:0}
.floor{position:fixed;left:-30%;right:-30%;bottom:-8%;height:55%;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(79,140,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(79,140,255,.22) 1px,transparent 1px);
  background-size:64px 64px;transform:perspective(500px) rotateX(62deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 85%);mask-image:linear-gradient(to top,#000 0%,transparent 85%);
  animation:drift 6s linear infinite}
@keyframes drift{to{background-position:0 64px}}
.haze{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 50% at 50% 38%,rgba(79,110,255,.16),transparent 70%),radial-gradient(40% 40% at 85% 90%,rgba(138,107,255,.12),transparent 70%)}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(5,7,15,.55);backdrop-filter:blur(6px)}
.card{width:min(420px,100%);padding:34px 28px 26px;border:1px solid var(--line);border-radius:22px;background:var(--panel);backdrop-filter:blur(18px);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.card h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:18px}
.card p{color:var(--dim);font-size:14px;line-height:1.6;margin-top:8px}
.gwrap{margin:24px auto 0;display:flex;justify-content:center;min-height:44px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:rgba(79,140,255,.08);font-size:14px;transition:.2s}
.btn:hover{background:rgba(79,140,255,.18);border-color:rgba(79,140,255,.45)}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--violet));border-color:transparent;font-weight:600}
.btn.full{width:100%}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12px;margin:16px 0}
.or::before,.or::after{content:"";height:1px;flex:1;background:var(--line)}
.field{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--text);font:13px var(--mono);margin-top:8px}
.field:focus{outline:none;border-color:var(--blue);box-shadow:var(--glow)}
.note{font-size:12px;color:var(--dim);text-align:left;line-height:1.55;margin-top:10px}
.note b{color:var(--cyan);font-weight:500}

/* ---------- orb ---------- */
.orb{--s:88px;position:relative;width:var(--s);height:var(--s);margin:0 auto}
.orb i{position:absolute;inset:0;border-radius:50%}
.orb .core{inset:22%;background:radial-gradient(circle at 35% 30%,#fff 0,#9fd6ff 18%,var(--blue) 50%,#1b2a7a 100%);box-shadow:0 0 40px 8px rgba(79,140,255,.55),inset 0 0 18px rgba(255,255,255,.5);animation:breathe 4s ease-in-out infinite}
.orb .r1,.orb .r2{border:1.5px solid rgba(120,190,255,.55);border-left-color:transparent;border-bottom-color:transparent}
.orb .r1{animation:spin 7s linear infinite}
.orb .r2{inset:-8%;border-color:rgba(138,107,255,.5);border-right-color:transparent;border-top-color:transparent;animation:spin 11s linear infinite reverse}
.orb .halo{inset:-45%;background:radial-gradient(circle,rgba(79,140,255,.28),transparent 62%);animation:breathe 4s ease-in-out infinite}
body.busy .orb .core,body.busy .orb .halo{animation-duration:1s}
body.busy .orb .r1{animation-duration:2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.09);filter:brightness(1.25)}}

/* ---------- layout ---------- */
#app{position:fixed;inset:0;z-index:1;display:none;grid-template-columns:288px 1fr}
#app.on{display:grid}
aside{display:flex;flex-direction:column;gap:12px;padding:16px 14px;border-right:1px solid var(--line);background:var(--panel);backdrop-filter:blur(16px);min-height:0;transition:transform .28s}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 6px}
.brand .orb{--s:30px;margin:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:10.5px;color:var(--dim);margin-top:1px}
.newchat{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(79,140,255,.08);font-size:14px;transition:.2s}
.newchat:hover{background:rgba(79,140,255,.18);border-color:rgba(79,140,255,.45)}
kbd{font:11px var(--mono);padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--dim)}
.search{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--text);font:13px var(--sans)}
.search:focus{outline:none;border-color:var(--blue)}
#hist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.grp{font-size:11px;color:var(--dim);padding:10px 8px 4px}
.item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;font-size:13.5px;color:#c4cdf0;cursor:pointer;transition:.15s}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover{background:rgba(255,255,255,.05)}
.item.on{background:rgba(79,140,255,.16);color:#fff;box-shadow:inset 2px 0 0 var(--blue)}
.item .x{opacity:0;color:var(--dim);padding:2px 6px;border-radius:6px}
.item:hover .x{opacity:1}.item .x:hover{color:#ff8a9b;background:rgba(255,80,110,.12)}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2)}
.me img,.me .av{width:34px;height:34px;border-radius:50%;flex:none;object-fit:cover;background:linear-gradient(135deg,var(--blue),var(--violet));display:grid;place-items:center;font-weight:600}
.me div{flex:1;min-width:0;font-size:13px}
.me div b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me div small{color:var(--dim);font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{padding:7px;border-radius:9px;color:var(--dim);transition:.15s}.ic:hover{color:#fff;background:rgba(255,255,255,.08)}

main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 16px;position:relative}
.menu{position:absolute;left:14px;display:none}
.tabs{display:flex;gap:6px;padding:5px;border-radius:16px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px)}
.tab{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:12px;font-size:13px;color:var(--dim);transition:.2s}
.tab i{width:7px;height:7px;border-radius:50%;background:#3a4570}
.tab:hover{color:#fff}
.tab.on{color:#fff;background:linear-gradient(135deg,rgba(79,140,255,.35),rgba(138,107,255,.3));box-shadow:var(--glow)}
.tab.on i{background:#5dffb0;box-shadow:0 0 8px #5dffb0}
.tab small{color:var(--dim);font-size:11px}

#scroll{flex:1;overflow:auto;padding:8px 20px 20px;scroll-behavior:smooth}
.col{max-width:780px;margin:0 auto}
.hero{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0 60px}
.hero .orb{--s:104px}
.hero h2{font-size:clamp(30px,5vw,46px);font-weight:600;letter-spacing:-.03em;margin-top:34px}
.hero h2 em{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .ready{color:var(--dim);font-size:13px;margin-top:10px;display:flex;align-items:center;gap:8px}
.hero .ready::before{content:"";width:6px;height:6px;border-radius:50%;background:#5dffb0;box-shadow:0 0 8px #5dffb0}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:30px;max-width:640px}
.chip{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);font-size:13.5px;transition:.2s}
.chip:hover{border-color:rgba(79,140,255,.6);box-shadow:var(--glow);transform:translateY(-2px)}

.msg{display:flex;gap:12px;margin:18px 0}
.msg.user{justify-content:flex-end}
.bub{max-width:88%;line-height:1.7;font-size:15px;overflow-wrap:anywhere}
.user .bub{padding:11px 16px;border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,#3a6cf0,#6a4fe0);box-shadow:0 8px 30px rgba(79,110,255,.25);white-space:pre-wrap}
.ai .avt{flex:none;width:30px;height:30px;margin-top:2px}
.ai .avt .orb{--s:26px;margin:2px}
.ai .bub{max-width:calc(100% - 44px);width:100%}
.bub p{margin:.55em 0}.bub p:first-child{margin-top:0}
.bub h1,.bub h2,.bub h3{margin:1.1em 0 .4em;letter-spacing:-.01em;line-height:1.3}
.bub h1{font-size:1.4em}.bub h2{font-size:1.2em}.bub h3{font-size:1.06em}
.bub ul,.bub ol{margin:.5em 0 .5em 1.4em}.bub li{margin:.25em 0}
.bub a{color:var(--cyan)}
.bub code{font:13px var(--mono);padding:2px 6px;border-radius:6px;background:rgba(79,140,255,.14);color:#bcd4ff}
.code{margin:.8em 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(3,6,16,.75)}
.code .ch{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:rgba(79,140,255,.08);font:12px var(--mono);color:var(--dim)}
.code .ch button{color:var(--dim);font:12px var(--mono);padding:3px 8px;border-radius:6px}.code .ch button:hover{color:#fff;background:rgba(255,255,255,.08)}
.code pre{padding:14px;overflow:auto}.code pre code{background:none;padding:0;color:#d5e1ff;font-size:13px;line-height:1.6}
.acts{display:flex;gap:6px;margin-top:8px}
.acts button{font-size:12px;color:var(--dim);padding:5px 10px;border-radius:8px;border:1px solid transparent}
.acts button:hover{color:#fff;border-color:var(--line);background:rgba(255,255,255,.05)}
.err{color:#ffb4c0;padding:10px 14px;border:1px solid rgba(255,90,120,.35);border-radius:12px;background:rgba(255,60,100,.08);font-size:14px}
.dots{display:inline-flex;gap:5px;padding:8px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:dot 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-5px)}}

.dock{padding:6px 20px calc(16px + env(safe-area-inset-bottom))}
.box{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 18px;border-radius:22px;border:1px solid rgba(79,140,255,.35);background:rgba(10,15,32,.78);backdrop-filter:blur(16px);box-shadow:0 0 0 1px rgba(79,140,255,.06),0 10px 50px rgba(30,60,200,.22);transition:.2s}
.box:focus-within{border-color:var(--blue);box-shadow:var(--glow),0 10px 50px rgba(30,60,200,.28)}
#in{flex:1;resize:none;max-height:180px;min-height:26px;background:none;border:0;outline:0;color:var(--text);font:15px/1.6 var(--sans);padding:6px 0}
#in::placeholder{color:#5f6b93}
#go{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:var(--glow);transition:.2s}
#go:hover{transform:scale(1.06)}#go:disabled{opacity:.4;transform:none}
#go.stop{background:#2a3358;box-shadow:none}
.hints{max-width:780px;margin:8px auto 0;display:flex;gap:14px;justify-content:center;font-size:11.5px;color:var(--dim);flex-wrap:wrap}

#scrim{display:none}
@media(max-width:820px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;z-index:20;inset:0 auto 0 0;width:min(300px,86vw);transform:translateX(-102%);background:rgba(8,12,26,.96)}
  aside.open{transform:none}
  #scrim.on{display:block;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.55)}
  .menu{display:block}
  .tab small{display:none}
  .bub{max-width:94%}
  .hints .h2{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- luau / code ---------- */
.modebar{max-width:780px;margin:0 auto 8px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
.mode{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font:500 12.5px var(--mono);color:var(--dim);transition:.2s;flex:none}
.mode.on{color:#fff;border-color:rgba(79,140,255,.6);background:rgba(79,140,255,.18);box-shadow:var(--glow)}
.steps{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.steps:empty{display:none}
.step{align-self:flex-start;max-width:100%;padding:7px 12px;border-radius:14px 14px 14px 4px;background:rgba(79,140,255,.10);border:1px solid var(--line);font-size:13px;line-height:1.5;color:#b9c6f2;animation:pop .28s ease-out}
.step.warn{color:#ffd9a0;border-color:rgba(255,180,90,.35);background:rgba(255,170,60,.08)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}}
.steps details summary{cursor:pointer;color:var(--dim);font-size:12.5px;padding:2px 0;list-style:none}
.steps details summary::-webkit-details-marker{display:none}
.steps details summary::before{content:"✅ "}
.steps details[open] summary{margin-bottom:6px}
.steps details .step{margin-top:6px;animation:none}
.code .ch{gap:10px;flex-wrap:wrap}
.code .ch .fn{color:#cfe0ff;font-weight:500}
.code .ch .meta{margin-left:auto;font-size:11px}
.code .ch .ca{display:flex;gap:2px}
.code.collapsed pre{display:none}
.code.file{border-color:rgba(79,140,255,.35)}
.t-kw{color:#b591ff}.t-fn{color:#54d2ff}.t-gl{color:#6fa8ff}.t-st{color:#93e6a8}.t-nu{color:#ffb56b}.t-cm{color:#5f6d9b;font-style:italic}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="haze"></div>
<div class="floor"></div>

<!-- ============ APP ============ -->
<div id="app">
  <aside id="side">
    <div class="brand"><div class="orb"><i class="r1"></i><i class="core"></i></div><div><b>KibaZ</b><small>Luau · Roblox Studio</small></div></div>
    <button class="newchat" id="new"><span>+&nbsp; Cuộc trò chuyện mới</span><kbd>Ctrl K</kbd></button>
    <input class="search" id="q" placeholder="Tìm cuộc trò chuyện" aria-label="Tìm cuộc trò chuyện">
    <div id="hist"></div>
    <div class="me"><div><b>KibaZ</b><small>Miễn phí · lưu trên máy bạn</small></div><button class="ic" id="cfg" title="Cài đặt API" aria-label="Cài đặt">⚙</button></div>
  </aside>
  <div id="scrim"></div>

  <main>
    <div class="top">
      <button class="ic menu" id="menu" aria-label="Mở menu">☰</button>
      <div class="tabs" id="tabs"></div>
    </div>
    <div id="scroll"><div class="col" id="col"></div></div>
    <div class="dock">
      <div class="modebar"><button class="mode on" id="mode" aria-pressed="true" title="Bật/tắt chế độ lập trình Luau">{ } Luau</button><span id="modeHint"></span></div>
      <div class="box">
        <textarea id="in" rows="1" placeholder="Nhắn cho KibaZ…" aria-label="Tin nhắn"></textarea>
        <button id="go" aria-label="Gửi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
      <div class="hints"><span><kbd>Enter</kbd> gửi</span><span class="h2"><kbd>Shift</kbd>+<kbd>Enter</kbd> xuống dòng</span><span class="h2"><kbd>Ctrl</kbd>+<kbd>K</kbd> chat mới</span></div>
    </div>
  </main>
</div>

<!-- ============ SETTINGS ============ -->
<div id="cfgModal" class="card" style="display:none;position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);text-align:left;max-height:90vh;overflow:auto">
  <h1 style="font-size:20px;margin:0">Cài đặt API</h1>
  <p class="note" style="margin-top:6px">Mặc định KibaZ dùng dịch vụ miễn phí của Pollinations, không cần key. Bạn có thể đổi sang bất kỳ API tương thích OpenAI.</p>
  <label class="note" style="display:block;margin-top:14px">Endpoint</label>
  <input class="field" id="cEnd" spellcheck="false">
  <label class="note" style="display:block;margin-top:12px">API key (để trống nếu không cần)</label>
  <input class="field" id="cKey" type="password" spellcheck="false">
  <label class="note" style="display:block;margin-top:12px">Model cho KZ1 / KZ2 / KZ3</label>
  <div style="display:flex;gap:8px"><input class="field" id="m1" spellcheck="false"><input class="field" id="m2" spellcheck="false"><input class="field" id="m3" spellcheck="false"></div>
  <div style="display:flex;gap:10px;margin-top:18px"><button class="btn" id="cCancel" style="flex:1">Đóng</button><button class="btn primary" id="cSave" style="flex:1">Lưu</button></div>
</div>

<script>
/* =====================================================
   KibaZ — cấu hình nhanh (có thể sửa trong ⚙ Cài đặt)
   ===================================================== */
const DEFAULTS = {
  endpoint: 'https://text.pollinations.ai/openai',   // miễn phí, không cần API key
  apiKey: '',
  models: { kz1: 'openai-fast', kz2: 'openai', kz3: 'openai-large' },
  googleClientId: ''                                   // dán Client ID của bạn vào đây hoặc trong màn hình đăng nhập
};
const TIERS = [
  { id:'kz1', name:'KZ1', sub:'Nhanh' },
  { id:'kz2', name:'KZ2', sub:'Cân bằng' },
  { id:'kz3', name:'KZ3', sub:'Sâu' }
];
const SYSTEM = `Bạn là KibaZ, trợ lý AI thân thiện và hữu ích. Trả lời bằng ngôn ngữ mà người dùng đang dùng (mặc định tiếng Việt). Trình bày rõ ràng, dùng Markdown khi cần, code đặt trong khối code có ghi ngôn ngữ. Nếu không chắc, hãy nói thẳng thay vì đoán.`;
const LUAU_RULES = `

CHẾ ĐỘ LUAU / ROBLOX STUDIO (ưu tiên khi người dùng cần code):
Quy trình bắt buộc trước khi trả lời: (1) hiểu mục tiêu, nếu thiếu thông tin thì giả định hợp lý và nêu giả định ở đầu; (2) chọn đúng loại script (Script, LocalScript, ModuleScript) và nơi đặt (ServerScriptService, StarterPlayerScripts, StarterGui, ReplicatedStorage...); (3) thiết kế để server giữ quyền quyết định, client chỉ gửi yêu cầu; (4) viết code; (5) tự rà soát lại từng dòng trước khi gửi.
Quy tắc code:
- Dòng đầu mỗi file: "-- File: Ten.server.lua (Vị trí: ServerScriptService)", dòng tiếp theo "--!strict". Dùng chú thích kiểu (type annotations) khi hợp lý.
- Dùng game:GetService("..."). Dùng task.wait, task.spawn, task.delay, task.defer; không dùng wait, spawn, delay.
- Ưu tiên sự kiện và RunService.Heartbeat thay cho vòng lặp while true do task.wait() do.

    sched();
  };

  // Cách 1: AI có sẵn trong khung xem trước của Claude. Tự viết tiếp nếu bị cắt giữa chừng.
  const viaClaude = async maxTok => {
    let full = '', msgs = hist.slice(), rounds = 0;
    while (true){
      const r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:maxTok, system:sys(), messages:msgs }) });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error((d.error && d.error.message) || ('Lỗi ' + r.status));
      const text = (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
      if (!text && !full) throw new Error('empty');
      full += text; await reveal(full);
      if (d.stop_reason === 'max_tokens' && rounds < 3 && !ctl.stopped){
        rounds++; addStep('📎 Code dài, đang viết tiếp phần còn lại…');
        msgs = [...hist, { role:'assistant', content:full.replace(/\s+$/, '') }, { role:'user', content:'Viết tiếp đúng từ chỗ đang dừng, không lặp lại phần đã viết, không chào hỏi.' }];
        continue;
      }
      break;
    }
  };
  // Cách 2: API ngoài (Pollinations hoặc endpoint bạn nhập trong ⚙)
  const viaApi = async () => {
    const headers = { 'Content-Type':'application/json' };
    if (cfg.apiKey) headers.Authorization = 'Bearer ' + cfg.apiKey;
    const res = await fetch(cfg.endpoint, { method:'POST', headers,
      body: JSON.stringify({ model:cfg.models[st.tier], messages:[{ role:'system', content:sys() }, ...hist], stream:true }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if ((res.headers.get('content-type') || '').includes('text/event-stream') && res.body){
      const rd = res.body.getReader(), dec = new TextDecoder(); let buf = ''; ctl.reader = rd;
      while (!ctl.stopped){
        const { done, value } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream:true });
        const lines = buf.split('\n'); buf = lines.pop();
        for (const l of lines){ const t = l.trim(); if (!t.startsWith('data:')) continue; const d = t.slice(5).trim(); if (d === '[DONE]') continue;
          try { const j = JSON.parse(d); const piece = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content; if (piece){ startWriting(); ai.content += piece; sched(); } } catch {} }
      }
    } else { const j = await res.json(); const t = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || ''; if (t) await reveal(t); }
    if (!ai.content && !ctl.stopped) throw new Error('empty');
  };

  try {
    let ok = false;
    for (const fn of [() => viaClaude(4000), () => viaClaude(1000), viaApi]){
      try { await fn(); ok = true; break; } catch (e){ if (ctl.stopped) break; ai.content = ''; }
    }
    timers.forEach(clearTimeout);
    if (ctl.stopped){ if (!ai.content) ai.error = 'Đã dừng.'; }
    else if (!ok) ai.error = 'Chưa kết nối được AI. Hãy thử lại sau ít phút. Nếu bạn mở KibaZ ở trình duyệt riêng, vào ⚙ Cài đặt để nhập endpoint và API key của bạn.';
    else {
      const res = lintAll(ai.content);
      if (res){ await sleep(300); addStep('🧪 Kiểm tra cơ bản: khối end, API cũ, DataStore, RemoteEvent…'); for (const w of res){ await sleep(380); addStep(w); } }
      await sleep(250); addStep('✅ Hoàn tất');
    }
    ai.done = true;
  } finally {
    st.abort = null; setBusy(false); save(); renderChat(true);
  }
}
$('#go').onclick = () => { if (st.busy){ if (st.abort){ st.abort.stopped = true; try { st.abort.reader && st.abort.reader.cancel(); } catch {} } } else { const v = $('#in'); const t = v.value; v.value = ''; autosize(); send(t); } };
$('#in').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); $('#go').click(); } });
function autosize(){ const t = $('#in'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 180) + 'px'; }
$('#in').addEventListener('input', autosize);

/* ---------- misc UI ---------- */
function renderMode(){
  const b = $('#mode'); b.classList.toggle('on', st.luau); b.setAttribute('aria-pressed', String(st.luau));
  $('#modeHint').textContent = st.luau ? 'Code ưu tiên ổn định cho Roblox Studio' : 'Chế độ chung';
  $('#in').placeholder = st.luau ? 'Mô tả script Luau bạn cần…' : 'Nhắn cho KibaZ…';
}
$('#mode').onclick = () => { st.luau = !st.luau; lsSet('kz_luau', st.luau); renderMode(); const c = cur(); if (!c || !c.msgs.length) renderChat(); };
$('#new').onclick = () => { if (st.busy) return; st.cur = null; renderHist(); renderChat(); closeMenu(); $('#in').focus(); };
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && st.user){ e.preventDefault(); $('#new').click(); } });
const openMenu = () => { $('#side').classList.add('open'); $('#scrim').classList.add('on'); };
const closeMenu = () => { $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); };
$('#menu').onclick = openMenu; $('#scrim').onclick = closeMenu;

/* settings */
$('#cfg').onclick = () => {
  $('#cEnd').value = cfg.endpoint; $('#cKey').value = cfg.apiKey; 
  $('#m1').value = cfg.models.kz1; $('#m2').value = cfg.models.kz2; $('#m3').value = cfg.models.kz3;
  $('#cfgModal').style.display = 'block';
};
$('#cCancel').onclick = () => $('#cfgModal').style.display = 'none';
$('#cSave').onclick = () => {
  cfg.endpoint = $('#cEnd').value.trim() || DEFAULTS.endpoint; cfg.apiKey = $('#cKey').value.trim();
  
  cfg.models = { kz1:$('#m1').value.trim() || DEFAULTS.models.kz1, kz2:$('#m2').value.trim() || DEFAULTS.models.kz2, kz3:$('#m3').value.trim() || DEFAULTS.models.kz3 };
  lsSet('kz_cfg', cfg); $('#cfgModal').style.display = 'none';
};

/* boot */
st.tier = lsGet('kz_tier', 'kz3');
startApp();
</script>
